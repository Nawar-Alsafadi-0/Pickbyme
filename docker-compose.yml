services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pickbyme:pickbyme@db:5432/pickbyme
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      THAWANI_SECRET_KEY: ${THAWANI_SECRET_KEY:-}
      THAWANI_PUBLISHABLE_KEY: ${THAWANI_PUBLISHABLE_KEY:-}
      THAWANI_API_BASE: ${THAWANI_API_BASE:-https://uatcheckout.thawani.om/api/v1}
      THAWANI_CHECKOUT_BASE: ${THAWANI_CHECKOUT_BASE:-https://uatcheckout.thawani.om/pay}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pickbyme
      POSTGRES_PASSWORD: pickbyme
      POSTGRES_DB: pickbyme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickbyme"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pickbyme_data:/var/lib/postgresql/data
volumes:
  pickbyme_data:
